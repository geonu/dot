- defaults:
    link:
      relink: true
      create: true

# Remove stale symlinks that point into this repo but whose source is gone,
# so re-running ./install converges (adds new, skips existing, drops dead).
- clean:
    '~':
      recursive: false
    '~/.config':
      recursive: true
    '~/.codex':
      recursive: false
    '~/.claude':
      recursive: false
    '~/.omp/agent':
      recursive: false

- shell:
  - [git submodule update --init --recursive, Installing submodules]

- link:
    ~/.dotfiles: ''
    ~/.Brewfile: Brewfile
    ~/.gitconfig: gitconfig
    ~/.bash_profile:
        force: true
        path: bash_profile
    ~/.zshrc: zshrc
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.config/nvim: nvim
    ~/.config/ghostty/config: ghostty/config
    ~/.config/mise/config.toml: mise/config.toml
    ~/.tmux.conf: tmux.conf
    ~/.psqlrc: psqlrc
    ~/.codex/AGENTS.md: codex/AGENTS.md
    ~/.claude/settings.json: claude/settings.json
    ~/.omp/agent/config.yml: omp/config.yml
