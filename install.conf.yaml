- defaults:
    link:
      relink: true

# Remove stale symlinks that point into this repo but whose source is gone,
# so re-running ./install converges (adds new, skips existing, drops dead).
- clean:
    ~:
    ~/.config:
      recursive: true

- shell:
  - [git submodule update --init --recursive, Installing submodules]

- link:
    ~/.dotfiles: ''
    ~/.Brewfile: Brewfile
    ~/.gitconfig: gitconfig
    ~/.bash_profile:
        force: true
        path: bash_profile
    ~/.zshrc: zshrc
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.config/nvim: nvim
    ~/.config/ghostty/config: ghostty/config
    ~/.config/mise/config.toml: mise/config.toml
    ~/.ideavimrc: ideavimrc
    ~/.tmux.conf: tmux.conf
    ~/.psqlrc: psqlrc
    ~/.fdignore: fdignore
