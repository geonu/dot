- defaults:
    link:
      relink: true

- clean: ['~']

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [mkdir -p ~/.config/nvim, Preparing NeoVim config directories]
  - [mkdir -p ~/.config/ghostty, Preparing Ghostty terminal config directories]
  - [mkdir -p ~/.config/mise, Preparing mise config directory]

- link:
    ~/.dotfiles: ''
    ~/.Brewfile: Brewfile
    ~/.gitconfig: gitconfig
    ~/.bash_profile:
        force: true
        path: bash_profile
    ~/.zshrc: zshrc
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.vimrc: vimrc # vimrc shortcut
    ~/.config/nvim/init.vim: vimrc
    ~/.config/ghostty/config: ghostty/config
    ~/.config/mise/config.toml: mise/config.toml
    ~/.ideavimrc: ideavimrc
    ~/.tmux.conf: tmux.conf
    ~/.psqlrc: psqlrc
    ~/.fdignore: fdignore
