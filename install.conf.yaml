- defaults:
    link:
      relink: true
      create: true

# Remove stale symlinks that point into this repo but whose source is gone,
# so re-running ./install converges (adds new, skips existing, drops dead).
- clean:
    '~':
      recursive: false
    '~/.config':
      recursive: true
    '~/.codex':
      recursive: false
    '~/.claude':
      recursive: false
    '~/.omp/agent':
      recursive: false
    '~/.local/bin':
      recursive: false
    '~/workspace':
      recursive: false


- shell:
  - [git submodule update --init --recursive, Installing submodules]

# Herdr creates a regular config file that dotbot will not replace.
- shell:
  - command: |
      p="$HOME/.config/herdr/config.toml"
      if [ -f "$p" ] && [ ! -L "$p" ]; then
        mv "$p" "$p.before-dotfiles-$(date +%Y%m%d-%H%M%S)"
        echo "Moved regular $p aside"
      fi
    description: Preserving local Herdr config before linking
    stdout: true
    stderr: true

- link:
    ~/.dotfiles: ''
    ~/.Brewfile: Brewfile
    ~/.gitconfig: gitconfig
    ~/.bash_profile:
        force: true
        path: bash_profile
    ~/.zshrc:
        force: true
        path: zshrc
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.config/nvim: nvim
    ~/.config/alacritty/alacritty.toml: alacritty/alacritty.toml
    ~/.config/herdr/config.toml: herdr/config.toml
    ~/.ssh/config.d/herdr-hosts.conf: ssh/herdr-hosts.conf
    ~/.config/mise/config.toml: mise/config.toml
    ~/.tmux.conf: tmux.conf
    ~/.psqlrc: psqlrc
    ~/.codex/AGENTS.md: agents/CORE.md
    ~/agents.md: agents/CORE.md
    ~/AGENTS.md:
        force: true
        path: agents/CORE.md
    ~/.claude/settings.json: claude/settings.json
    ~/.omp/agent/config.yml: omp/config.yml
    ~/.omp/agent/mcp.json: omp/mcp.json
    ~/.omp/agent/APPEND_SYSTEM.md: omp/APPEND_SYSTEM.md
    ~/.omp/agent/AGENTS.md:
        force: true
        path: ~/AGENTS.md
    ~/.omp/agent/RULES.md: omp/RULES.md
    ~/.omp/agent/extensions: omp/extensions
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/skills: claude/skills
    ~/Library/LaunchAgents/com.geonu.alacritty-login.plist: launchd/com.geonu.alacritty-login.plist
    # Fleet multi-claw policy + host helpers (see workspace/AGENTS.md)
    ~/workspace/AGENTS.md: workspace/AGENTS.md
    ~/.local/bin/claw-id: bin/claw-id
    ~/.local/bin/credentials-init: bin/credentials-init
    ~/.local/bin/git-worktree-new: bin/git-worktree-new

# Converge Homebrew to the Brewfile (mirrors the `clean` directive for symlinks):
# install anything missing and uninstall anything not listed. Third-party tap
# trust comes from the Brewfile's `trusted: true` entries: `install` applies it
# before loading them and `cleanup --force` resets the trust store to it.
# Runs after `link` so ~/.Brewfile exists for `--global`.
# DESTRUCTIVE: `cleanup --force` removes brew packages/casks/taps absent from the
# Brewfile. No-op (clean exit) when Homebrew is not installed.
- shell:
  - command: |
      command -v brew >/dev/null 2>&1 || { echo "Homebrew not installed; skipping Brewfile sync"; exit 0; }
      brew bundle install --global
      brew bundle cleanup --global --force
    description: Syncing Homebrew packages from Brewfile
    stdout: true
    stderr: true

# Only Terminal.app installs configure its saved default profile automatically.
- shell:
  - command: |
      if [ "${TERM_PROGRAM:-}" = Apple_Terminal ]; then
        ./bin/terminal-font
      else
        echo 'Terminal font skipped (not running from Terminal.app); run ./bin/terminal-font [profile name] separately.'
      fi
    description: Configuring Terminal.app font
    stdout: true
    stderr: true

# Runtimes and user-level globals that live outside Homebrew. Each has exactly
# one home: runtimes in mise (mise/config.toml), bun globals in ~/.bun, npm
# globals under mise's node, pip --user packages under mise's python (lists in
# packages/). Install-if-missing only: nothing here upgrades or removes. bun
# itself comes from its official installer (see README) and is skipped if absent.
- shell:
  - command: |
      command -v mise >/dev/null 2>&1 || { echo "mise not installed; skipping runtimes/globals"; exit 0; }
      mise install
      grep -vE '^[[:space:]]*(#|$)' packages/npm-global.txt | while read -r p; do
        mise exec -- npm ls -g --depth=0 "$p" >/dev/null 2>&1 || mise exec -- npm install -g "$p"
      done
      mise exec -- python -m pip install --user --quiet --disable-pip-version-check -r packages/pip-user.txt
      bun_home="${BUN_INSTALL:-$HOME/.bun}"
      if [ -x "$bun_home/bin/bun" ]; then
        grep -vE '^[[:space:]]*(#|$)' packages/bun-global.txt | while read -r p; do
          [ -d "$bun_home/install/global/node_modules/$p" ] || "$bun_home/bin/bun" add -g "$p"
        done
      else
        echo "bun not installed; skipping packages/bun-global.txt"
      fi
    description: Installing mise runtimes and user-level global packages
    stdout: true
    stderr: true

# Bootstrap tmux plugins: clone TPM if missing, then install/update the plugins
# declared in tmux.conf (resurrect, continuum, yank, sensible). Without this a
# fresh machine has no plugins and @continuum-restore silently does nothing.
- shell:
  - command: |
      command -v tmux >/dev/null 2>&1 || { echo "tmux not installed; skipping plugin bootstrap"; exit 0; }
      tpm_dir="$HOME/.tmux/plugins/tpm"
      [ -d "$tpm_dir" ] || git clone --depth 1 https://github.com/tmux-plugins/tpm "$tpm_dir"
      TMUX_PLUGIN_MANAGER_PATH="$HOME/.tmux/plugins/" "$tpm_dir/bin/install_plugins"
    description: Installing tmux plugins via TPM
    stdout: true
    stderr: true

# Make SSH load shared hosts, then merge missing TUI profiles without touching
# existing profile IDs, labels, enabled states, or running remote sessions.
- shell:
  - command: |
      cfg="$HOME/.ssh/config"
      line='Include config.d/herdr-hosts.conf'
      chmod 700 "$HOME/.ssh" "$HOME/.ssh/config.d"
      if ! grep -qxF "$line" "$cfg" 2>/dev/null; then
        [ -f "$cfg" ] && cp -p "$cfg" "$cfg.before-herdr-$(date +%Y%m%d-%H%M%S)"
        printf '\n# Herdr common hosts from the dot repo (Match all keeps local Host rules first)\nMatch all\n%s\n' "$line" >> "$cfg"
        echo "Added Herdr hosts Include to $cfg"
      fi
      catalog="$HOME/.local/state/herdr/client/endpoints.json"
      dir="$(dirname "$catalog")"
      mkdir -p "$dir"
      chmod 700 "$dir"
      if [ ! -f "$catalog" ]; then
        printf '{"version":1,"ssh":[]}\n' > "$catalog"
        chmod 600 "$catalog"
      fi
      snapshot="$dir/.endpoints.before-dotfiles.$$"
      merged="$dir/.endpoints.merged.$$"
      cp -p "$catalog" "$snapshot"
      jq -e '.version == 1 and (.ssh | type == "array")' "$snapshot" >/dev/null
      jq --slurpfile shared herdr/endpoints.json '
        reduce $shared[0].ssh[] as $entry (.;
          if any(.ssh[]; .target == $entry.target and .session == $entry.session)
          then . else .ssh += [$entry] end)
      ' "$snapshot" > "$merged"
      chmod 600 "$merged"
      if ! jq -e --slurpfile merged "$merged" '. == $merged[0]' "$snapshot" >/dev/null; then
        if ! cmp -s "$snapshot" "$catalog"; then
          mv "$merged" "$catalog.conflict-$(date +%Y%m%d-%H%M%S)"
          rm "$snapshot"
          echo "Herdr catalog changed during merge; preserved conflict" >&2
          exit 1
        fi
        backup="$(mktemp "$catalog.before-dotfiles-$(date +%Y%m%d-%H%M%S).XXXXXX")"
        cp -p "$catalog" "$backup"
        mv "$merged" "$catalog"
        echo "Added missing Herdr TUI machines"
      else
        rm "$merged"
      fi
      rm "$snapshot"
    description: Syncing Herdr SSH hosts and remote machines
    stdout: true
    stderr: true
