# Alacritty configuration - managed in ~/.dotfiles
# https://alacritty.org/config-alacritty.html
#
# Chosen over Ghostty for long, varied agent sessions: GPU-rendered, lowest RAM
# of any emulator, and a hard-bounded scrollback that cannot balloon into OOM.
# Inline images are gone -- use `img <file>` (qlmanage Quick Look) for the rare
# case. tmux provides tabs/splits, so Alacritty's lack of them costs nothing.

[env]
# Robust over TERM = "alacritty": that requires the alacritty terminfo to be
# present everywhere (breaks on bare SSH targets). xterm-256color is universal,
# and COLORTERM advertises 24-bit so nvim/delta render truecolor outside tmux;
# inside tmux, `terminal-features "*:RGB"` forces RGB regardless.
TERM = "xterm-256color"
COLORTERM = "truecolor"
# Alacritty sets no TERM_PROGRAM of its own; mark it so ~/.zshrc's tmux
# auto-attach fires. tmux overrides this to "tmux" once attached, which is fine
# — the auto-attach guard only runs before $TMUX is set.
TERM_PROGRAM = "alacritty"

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[window]
option_as_alt = "Both"      # left+right Option send Meta (Alt keybinds work)
dynamic_padding = true
decorations = "buttonless"  # macOS: keep traffic-light-free minimal titlebar

[window.padding]
x = 6
y = 6

[font]
size = 13.0

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[scrolling]
history = 10000    # hard cap; Alacritty never grows past this (no leak path)
multiplier = 3

[selection]
save_to_clipboard = true

[terminal]
# osc52 controls OSC 52 clipboard access. Default "OnlyCopy" lets programs WRITE
# the clipboard but blocks READ; "CopyPaste" also allows read, so a program that
# pastes by querying the clipboard over OSC 52 can still get it. NOTE: tmux now
# runs set-clipboard OFF and omp reads/writes the macOS pasteboard natively, so
# this is a general allowance, not something omp requires. (Security: any program,
# incl. over SSH, can read the clipboard via escape -- fine locally; set
# "OnlyCopy" to revert.)
osc52 = "CopyPaste"

# --- Gruvbox Dark (matches the former Ghostty theme) -----------------------
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

# --- paste: route Cmd+V through tmux so external copy reliably lands inside ---
# Alacritty's native Paste streams the clipboard straight to the pty, where the
# nested tmux bracketed-paste state is unreliable (multiline breaks) and the omp
# TUI's OSC52-read paste sees tmux's own empty buffer -- not the macOS clipboard.
# Send `C-a ]` instead (\u0001 = Ctrl-A prefix, then ]), hitting tmux's prefix `]`
# binding, which loads pbpaste into a tmux buffer and injects it as a proper
# per-pane bracketed paste. Every interactive Alacritty auto-execs into tmux
# (see ~/.zshrc), so the prefix is always live.
[[keyboard.bindings]]
key = "V"
mods = "Command"
chars = "\u0001]"
