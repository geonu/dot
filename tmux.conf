# tmux plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

## automatic session restore (resurrect + continuum)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

## clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
# Route tmux-yank's copy (y, mouse-drag) through the guarded helper so an empty
# selection can never wipe the pasteboard (see bin/tmux-clip-copy).
set -g @override_copy_command '~/.dotfiles/bin/tmux-clip-copy'

# end tmux plugin

# --- session restore tuning ---
# Restore the last saved environment automatically on tmux server start.
set -g @continuum-restore 'on'
# Save every 5 min so a hard reboot/power loss costs at most ~5 min of layout.
set -g @continuum-save-interval '5'
# Restore pane scrollback contents, not just the layout.
set -g @resurrect-capture-pane-contents 'on'
# Restore nvim sessions when a pane was running nvim (uses :mksession).
set -g @resurrect-strategy-nvim 'session'

# --- auto-resume OMP sessions across restore ---
# Bridge tmux-resurrect to OMP: on every save, bin/omp-save-panes records each
# omp pane's live session id (+cwd, profile) into a sidecar; after restore,
# bin/omp-restore-panes respawns exactly those panes back into their sessions —
# no per-pane C-a R hunting. Hook values are eval'd by resurrect's execute_hook,
# so they ARE the command; `zsh -lic` sources ~/.zshrc to expose the OMP
# helpers. Restore is gated by OMP_TMUX_RESTORE_CONTEXT so it only fires here.
set -g @omp-default-profile 'gpt'
set -g @omp-profile-choices 'gpt-glm/gpt/grok/kimi/claude/combo-claude/combo-gpt/combo-grok/config'
# Save runs every ~5min: background it (`run-shell -b`) so the lsof/ps scan
# never stalls the tmux server; the sidecar is independent of resurrect's save.
set -g @resurrect-hook-post-save-all "tmux run-shell -b 'zsh -lic \"source ~/.dotfiles/bin/omp-save-panes\"'"
# Restore respawns N OMP panes (per-cwd session validation + N agent boots), so
# background it too (`run-shell -b`): resurrect's restore returns immediately and
# the tmux server never blocks while panes refill. The env var inside the
# run-shell arg keeps the OMP_TMUX_RESTORE_CONTEXT gate (resurrect-only) intact.
set -g @resurrect-hook-post-restore-all "tmux run-shell -b 'OMP_TMUX_RESTORE_CONTEXT=resurrect zsh -lic \"source ~/.dotfiles/bin/omp-restore-panes\"'"

# unbind default prefix and set it to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Zoom toggles. omp owns pane-resize repaint: inside a multiplexer it repaints
# the visible window in place after a settle debounce (omp issue #2088) and
# deliberately suppresses ED3/destructive-clear (mux pane scrollback can't be
# erased safely). An external Ctrl+L (app.display.reset) therefore can't clear
# stale rows in a mux and only races that debounce -- so no repaint hook, trust
# the engine. If the visible window still breaks on zoom, launch omp with
# PI_TUI_RESIZE_IN_PLACE=0 to force a full ED3 repaint (trades duplicated pane
# scrollback per resize for a clean redraw).
bind z resize-pane -Z
bind f resize-pane -Z

# Layout: default `prefix Space` cycles next-layout, which easily flattens many
# panes into even-horizontal/even-vertical by accident. Rebind it to a clean
# `tiled` grid so a stray press tidies panes instead of wrecking the layout.
# Explicit layouts are still on prefix M-1..M-7.
unbind Space
bind Space select-layout tiled

# scrollback buffer. Sized for long agent transcripts / build logs without
# letting inactive panes grow indefinitely. ~30k lines/pane leaves roughly
# twice the headroom of the longest panes in normal use on this box.
set -g history-limit 30000

# Start window and pane index from 1 instead of 0.
set -g base-index 1
setw -g pane-base-index 1

# enable mouse support for switching panes/windows
setw -g mouse on

# --- inline images / passthrough ---
# The primary terminal is Alacritty, which has no inline-image protocol (no
# Kitty graphics, no sixel). Preview images out-of-band with `img <file>`
# (qlmanage Quick Look). allow-passthrough stays ON so OMP/OSC52 clipboard
# queries tunnel through tmux to Alacritty; terminal-features advertises 24-bit
# colour to programs running inside tmux.
set -g allow-passthrough on
set -ga terminal-features "*:RGB"

# synchronize all panes in a window

# Restart the current pane into the latest OMP session in that directory.
# Prompt chooses provider overrides from @omp-profile-choices and seeds @omp-default-profile.
bind R command-prompt -p "OMP profile (#{@omp-profile-choices})" -I "#{@omp-default-profile}" \
  "run-shell 'zsh -lic \"ompr_tmux_respawn %1 #{pane_id}\"'"

# Same as `R`, but respawn EVERY pane in the current window into its latest OMP
# session at once. Each pane resolves its own session, so this is the correct
# way to switch all panes' profile -- do NOT use synchronize-panes for this.
bind A command-prompt -p "OMP profile ALL panes (#{@omp-profile-choices})" -I "#{@omp-default-profile}" \
  "run-shell 'zsh -lic \"ompr_tmux_respawn_all %1 #{window_id}\"'"

# Toggle synchronize-panes (mirror input to every pane in the window). On `S`
# because tmux-yank loads after this file and steals `prefix y` for line-copy.
bind S setw synchronize-panes

# pane titles: show them on the top border, and bind C-a T to set the current
# pane's title. allow-rename off keeps programs from overwriting the label.
set -g allow-rename off
set -g pane-border-status top
# Leading #{?@omp_attn_pane,...}: the omp tmux-attention extension flags a pane on
# turn_end so the border dot marks which agent is waiting (cleared on focus; see
# bin/tmux-theme.sh). colour198 = active-border pink so it stands out on the
# grey inactive borders where waiting agents actually sit.
set -g pane-border-format " #{?@omp_attn_pane,#[fg=colour198 bold]●#[default] ,}#{?pane_synchronized,[SYNC] ,}#P #{?pane_title,#{pane_title},#{pane_current_command}} "
bind T command-prompt -p "pane title:" "select-pane -T '%%'"

set -g default-shell $SHELL
# Clipboard = the macOS pasteboard, owned by pbcopy (every copy binding pipes to
# it) and pbpaste (every paste path reads it). OFF: nothing in this stack needs
# tmux's OSC 52 clipboard -- omp reads/writes the pasteboard natively, nvim uses
# clipboard=unnamedplus (pbcopy), and tmux copies pipe to pbcopy directly. ON
# would only double-fire a redundant OSC 52 alongside pbcopy on every copy.
set -s set-clipboard off

# Paste the macOS pasteboard with `prefix ]` (also bound to Cmd+V in Alacritty):
# pbpaste reads the real pasteboard (Chrome copies included) and tmux injects it
# as a per-pane bracketed paste -- TEXT-explicit, so the text pastes even when a
# rich copy also carries an image (omp's own Ctrl+V is image-preferred and can
# grab the image instead of the text). Works in omp, zsh, nvim, pagers alike.
# For image paste into omp, press Ctrl+V directly.
bind ] run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer -p -d"

# Same paste, reachable from copy-mode. Cmd+V sends `C-a ]`; `]` was unbound in
# the copy tables, so Cmd+V did NOTHING whenever a pane sat in copy-mode (e.g.
# after Alt+wheel scrolling omp output) -- a real cause of "paste works, then
# doesn't". The leading `C-a` only nudges the cursor; `]` then cancels + pastes.
# Bound in BOTH tables: mode-keys is emacs (default) so `copy-mode` is the live
# one; copy-mode-vi covers a future `mode-keys vi` switch.
bind -T copy-mode    ] send-keys -X cancel \; run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer -p -d"
bind -T copy-mode-vi ] send-keys -X cancel \; run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer -p -d"

# --- per-pane mouse copy that survives mouse-grabbing TUIs -----------------
# Plain drag enters copy-mode only when NO app owns the mouse, so dragging over
# the omp TUI / nvim / less (mouse reporting on) copies nothing. Shift+drag is
# Alacritty's own selection -- it ignores tmux panes and bleeds across splits.
# Alt(Option)+drag fixes both: Alacritty forwards Option as a Meta-modified
# mouse event (option_as_alt="Both"), tmux grabs it regardless of the app,
# clamps the selection to the one pane, and pbcopy's on release.
bind -n M-MouseDrag1Pane copy-mode -M
bind -T copy-mode-vi M-MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '~/.dotfiles/bin/tmux-clip-copy'

# --- make EVERY copy land in the macOS pasteboard (single source of truth) --
# All copy paths pipe through bin/tmux-clip-copy (a guarded pbcopy): it writes
# the pasteboard but SKIPS an empty/whitespace selection, so a stray zero-width
# drag or a blank-line copy can't wipe a real copy and leave the next paste with
# nothing. tmux-yank's y/drag use it too (@override_copy_command above). The
# default word/line/Enter copies otherwise only set tmux's internal buffer (with
# set-clipboard off), which no paste path reads -- so route them here as well.
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel '~/.dotfiles/bin/tmux-clip-copy' }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel '~/.dotfiles/bin/tmux-clip-copy' }
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel '~/.dotfiles/bin/tmux-clip-copy'
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel '~/.dotfiles/bin/tmux-clip-copy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '~/.dotfiles/bin/tmux-clip-copy'
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel '~/.dotfiles/bin/tmux-clip-copy'
bind -T copy-mode-vi D send-keys -X copy-pipe-end-of-line-and-cancel '~/.dotfiles/bin/tmux-clip-copy'

# --- per-pane wheel scroll that survives mouse-grabbing TUIs ----------------
# Plain wheel over the omp TUI / nvim / less (mouse reporting on) is forwarded
# to the app (default WheelUpPane bails on #{mouse_any_flag}), so it scrolls the
# app's own small viewport -- which clips against its input box / chrome instead
# of revealing tmux's real scrollback. Alt(Option)+wheel grabs the event
# regardless of the app (same trick as Alt+drag above): it enters tmux copy-mode
# and scrolls the full pane history, 5 lines per notch.
bind -n M-WheelUpPane   if -F '#{pane_in_mode}' 'send-keys -X -N 5 scroll-up'   'copy-mode -e'
bind -n M-WheelDownPane if -F '#{pane_in_mode}' 'send-keys -X -N 5 scroll-down' 'copy-mode -e'

# beautify tmux
source ~/.dotfiles/bin/tmux-theme.sh

# TPM must run after every local binding. `run -b` here races its plugins
# against the copy-mode bindings above; `tmux-yank` then replaces `]`.
run '~/.tmux/plugins/tpm/tpm'
