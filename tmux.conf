# tmux plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

## automatic session restore (resurrect + continuum)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

## clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

run -b '~/.tmux/plugins/tpm/tpm'
# end tmux plugin

# --- session restore tuning ---
# Restore the last saved environment automatically on tmux server start.
set -g @continuum-restore 'on'
# Save every 5 min so a hard reboot/power loss costs at most ~5 min of layout.
set -g @continuum-save-interval '5'
# Restore pane scrollback contents, not just the layout.
set -g @resurrect-capture-pane-contents 'on'
# Restore nvim sessions when a pane was running nvim (uses :mksession).
set -g @resurrect-strategy-nvim 'session'

# unbind default prefix and set it to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Zoom: toggle the current pane to fill the window (focus/full). `prefix f`.
bind f resize-pane -Z

# Layout: default `prefix Space` cycles next-layout, which easily flattens many
# panes into even-horizontal/even-vertical by accident. Rebind it to a clean
# `tiled` grid so a stray press tidies panes instead of wrecking the layout.
# Explicit layouts are still on prefix M-1..M-7.
unbind Space
bind Space select-layout tiled

# scrollback buffer; capped low to bound tmux server RAM in long multi-pane work
set -g history-limit 10000

# Start window and pane index from 1 instead of 0.
set -g base-index 1
setw -g pane-base-index 1

# enable mouse support for switching panes/windows
setw -g mouse on

# --- inline images (Kitty graphics) ---
# Ghostty supports the Kitty graphics protocol but NOT sixel (intentionally,
# upstream won't add it). chafa detects tmux and emits Kitty graphics wrapped in
# tmux passthrough using unicode placeholders (U=1), which tmux forwards to
# Ghostty for true inline images -- this only requires allow-passthrough on.
# View images with the kitty format, e.g.  chafa -f kitty img.png  (alias: img)
set -g allow-passthrough on
set -ga terminal-features "*:RGB"

# synchronize all panes in a window

# Restart the current pane into the latest OMP session in that directory.
# Prompt chooses provider overrides: gpt, claude, fable-codex, combo-claude, combo-gpt, or config.
bind R command-prompt -p "OMP profile (gpt/claude/fable-codex/combo-claude/combo-gpt/config)" -I "gpt" \
  "run-shell 'zsh -lic \"ompr_tmux_respawn %1 #{pane_id}\"'"

# Toggle synchronize-panes (mirror input to every pane in the window). On `S`
# because tmux-yank loads after this file and steals `prefix y` for line-copy.
bind S setw synchronize-panes

# pane titles: show them on the top border, and bind C-a T to set the current
# pane's title. allow-rename off keeps programs from overwriting the label.
set -g allow-rename off
set -g pane-border-status top
set -g pane-border-format " #{?pane_synchronized,[SYNC] ,}#P #{?pane_title,#{pane_title},#{pane_current_command}} "
bind T command-prompt -p "pane title:" "select-pane -T '%%'"

set -g default-shell $SHELL
set -s set-clipboard on

# beautify tmux
source ~/.dotfiles/bin/tmux-theme.sh

