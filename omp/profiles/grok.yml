# Grok-primary OMP model profile.
# Grok 4.7 owns every primary; approved recovery may use Astra or Luna.
modelRoles:
  default: xai-oauth/grok-4.7:medium
  smol: xai-oauth/grok-4.7:low
  slow: xai-oauth/grok-4.7:high
  vision: xai-oauth/grok-4.7:medium
  plan: xai-oauth/grok-4.7:xhigh
  commit: xai-oauth/grok-4.7:minimal
  task: xai-oauth/grok-4.7:medium
# Concrete retry tails omit the default because it is already every role's primary.
retry:
  fallbackChains:
    plan: []
    slow:
      - openai-codex/gpt-6-astra:xhigh
    task:
      - openai-codex/gpt-6-luna:medium
# Neutral pins: omp/config.yml overrides deep-merge into every overlay; keep bundled reviewer/sonic defaults.
task:
  perCallModel: "on"
  agentModelOverrides:
    reviewer: "@slow"
    sonic: "@smol"
