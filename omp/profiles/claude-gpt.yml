# Claude-GPT OMP model profile.
# Claude owns the default role; GPT owns the remaining roles.
# Opus 5.5 owns default long-running orchestration at high; Astra owns slow/vision/plan, GPT-6.1 Sol executes tasks, and GPT-6 Luna keeps utilities lightweight.
modelRoles:
  default: anthropic/claude-opus-5-5:high
  smol: openai-codex/gpt-6-luna:low
  slow: openai-codex/gpt-6-astra:high
  vision: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:xhigh
  commit: openai-codex/gpt-6-luna:off
  task: openai-codex/gpt-6.1-sol:medium
# Neutral pins: omp/config.yml overrides deep-merge into every overlay; keep bundled reviewer/sonic defaults.
task:
  agentModelOverrides:
    reviewer: "@slow"
    sonic: "@smol"
