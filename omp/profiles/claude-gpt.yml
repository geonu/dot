# Claude-GPT OMP model profile.
# Claude owns the default role; GPT owns the remaining roles.
# Opus 5.5 owns default long-running orchestration at xhigh; Astra owns burst reasoning/planning, Sol keeps visual/design work, and Terra executes tasks.
modelRoles:
  default: anthropic/claude-opus-5-5:xhigh
  smol: openai-codex/gpt-6-luna:low
  slow: openai-codex/gpt-6-astra:high
  vision: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:xhigh
  designer: openai-codex/gpt-5.6-sol:high
  commit: openai-codex/gpt-6-luna:off
  task: openai-codex/gpt-5.6-terra:medium
