# GPT-6 Astra owns slow/vision/plan for high-risk reasoning, multimodal, and planning work; GPT-5.6 Sol keeps designer, and Terra executes tasks.
modelRoles:
  default: openai-codex/gpt-5.6-terra:medium
  smol: anthropic/claude-haiku-4-5:minimal
  slow: openai-codex/gpt-6-astra:high
  vision: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:xhigh
  designer: openai-codex/gpt-5.6-sol:high
  commit: anthropic/claude-haiku-4-5:off
  task: openai-codex/gpt-5.6-terra:medium
