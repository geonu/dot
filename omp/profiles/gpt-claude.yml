# GPT-Claude OMP model profile.
# GPT owns the default role; Claude owns slow and task roles.
# GPT-6.1 Sol owns orchestration, Astra owns vision/plan, Opus 5.5 executes tasks, Fable 5.1 handles slow escalation, and GPT-6 Luna keeps utilities lightweight.
modelRoles:
  default: openai-codex/gpt-6.1-sol:high
  smol: openai-codex/gpt-6-luna:low
  slow: anthropic/claude-fable-5-1:high
  vision: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:xhigh
  commit: openai-codex/gpt-6-luna:off
  task: anthropic/claude-opus-5-5:medium
