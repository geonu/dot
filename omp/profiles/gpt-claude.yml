# GPT-Claude OMP model profile.
# GPT owns the default role; Claude owns slow and task roles.
# GPT-6.1 Sol owns orchestration, Astra owns vision/plan, Sonnet 5.5 executes tasks and handles slow escalation at xhigh, and GPT-6 Luna keeps utilities lightweight.
# The reviewer agent runs on Astra so Sonnet-written code gets a cross-vendor review; sonic runs on GPT-6.1 Sol low instead of Luna.
modelRoles:
  default: openai-codex/gpt-6.1-sol:high
  smol: openai-codex/gpt-6-luna:low
  slow: anthropic/claude-sonnet-5-5:xhigh
  vision: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:xhigh
  commit: openai-codex/gpt-6-luna:off
  task: anthropic/claude-sonnet-5-5:medium
# Chat retry tails require concrete selectors; keep these aligned with modelRoles.default.
retry:
  fallbackChains:
    plan:
      - openai-codex/gpt-6.1-sol:high
    slow:
      - openai-codex/gpt-6-astra:xhigh
      - openai-codex/gpt-6.1-sol:high
    task:
      - openai-codex/gpt-6-luna:medium
      - openai-codex/gpt-6.1-sol:high
task:
  agentModelOverrides:
    reviewer: openai-codex/gpt-6-astra:high
    sonic: openai-codex/gpt-6.1-sol:low
