# Grok-GPT OMP model profile.
# Grok owns the default role; GPT owns the remaining roles.
# Grok 4.7 owns default, GPT-6 Astra owns slow/vision/plan, GPT-6.1 Sol executes tasks, and GPT-6 Luna keeps utilities lightweight.
modelRoles:
  default: xai-oauth/grok-4.7:medium
  smol: openai-codex/gpt-6-luna:low
  slow: openai-codex/gpt-6-astra:high
  vision: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:xhigh
  commit: openai-codex/gpt-6-luna:off
  task: openai-codex/gpt-6.1-sol:medium
# Concrete retry tails follow this profile's default; omit models already used by the primary.
retry:
  fallbackChains:
    plan:
      - xai-oauth/grok-4.7:medium
    slow:
      - xai-oauth/grok-4.7:medium
    task:
      - openai-codex/gpt-6-luna:medium
      - xai-oauth/grok-4.7:medium
# Neutral pins: omp/config.yml overrides deep-merge into every overlay; keep bundled reviewer/sonic defaults.
task:
  perCallModel: "on"
  agentModelOverrides:
    reviewer: "@slow"
    sonic: "@smol"
