# Grok-GPT OMP model profile.
# Grok owns the default role; GPT owns the remaining roles.
# GPT-6 Astra owns slow/vision/plan for high-risk reasoning, multimodal, and planning work, and GPT-6 Sol executes tasks.
modelRoles:
  default: xai-oauth/grok-4.7:medium
  smol: openai-codex/gpt-6-luna:low
  slow: openai-codex/gpt-6-astra:high
  vision: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:xhigh
  commit: openai-codex/gpt-6-luna:off
  task: openai-codex/gpt-6-sol:medium
