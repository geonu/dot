symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 3
modelRoles:
  smol: openai-codex/gpt-6-luna:low
  slow: openai-codex/gpt-6-astra:high
  vision: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:xhigh
  commit: openai-codex/gpt-6-luna:off
  task: openai-codex/gpt-6.1-sol:medium
  default: openai-codex/gpt-6.1-sol:medium
retry:
  modelFallback: true
  fallbackChains:
    plan:
      - openai-codex/gpt-6.1-sol:medium
    slow:
      - openai-codex/gpt-6.1-sol:medium
    task:
      - openai-codex/gpt-6-luna:medium
memory:
  backend: local
defaultThinkingLevel: auto
display:
  showTokenUsage: true
  shimmer: disabled
showHardwareCursor: true
task:
  perCallModel: "on"
  showResolvedModelBadge: true
  agentModelOverrides:
    reviewer: "@slow"
    sonic: "@smol"
dev:
  autoqaConsent: granted
browser:
  relay: true
  relayUrl: http://127.0.0.1:27777
composer:
  shape: field
worktree:
  clone: false
update:
  auto: true