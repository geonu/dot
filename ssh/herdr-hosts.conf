# Common SSH hosts shared through the dot repo (linked to ~/.ssh/config.d/herdr-hosts.conf).
# Loaded at the end of ~/.ssh/config, so each machine's own Host rules win.
# Host names only: keys, known_hosts, agent sockets and passwords stay per machine.
# Do not relax StrictHostKeyChecking or enable ForwardAgent here.

Host geonu-hangers-mac-mini-1
    HostName geonu-hangers-mac-mini-1.tail124ace.ts.net
    User geonu-hanger

Host geonu-tandumui-macmini
    HostName geonu-tandumui-macmini.tail124ace.ts.net
    User geonu-tandum

Host leeui-macmini
    HostName leeui-macmini.tail124ace.ts.net
    User lee

Host macbook-pro-2-1
    HostName macbook-pro-2-1.tail124ace.ts.net
    User lee
